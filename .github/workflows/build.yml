name: Native build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            preset: macos-release
            workgroup: 128
          - os: macos-15
            preset: macos-release
            workgroup: 256
          - os: windows-2022
            preset: windows-release
            workgroup: 128
          - os: windows-2022
            preset: windows-release
            workgroup: 256
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: seanmiddleditch/gha-setup-ninja@v5
        with:
          destination: ${{ runner.temp }}/particleworld-ninja
      - name: Set up compiler cache
        if: runner.os == 'Windows'
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Verify clean checkout after tool setup
        shell: bash
        run: |
          git status --short
          test -z "$(git status --porcelain)"
      - name: Configure pinned dependencies
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DPW_WORKGROUP_SIZE=${{ matrix.workgroup }}
          -DCMAKE_C_COMPILER_LAUNCHER=${{ runner.os == 'Windows' && 'sccache' || '' }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ runner.os == 'Windows' && 'sccache' || '' }}
      - name: Compile application and backend shaders
        run: cmake --build --preset ${{ matrix.preset }} --parallel 3
      - name: CPU invariants
        run: ctest --preset ${{ matrix.preset }}
      - name: Package
        run: cmake --install build/${{ matrix.preset }} --prefix out/${{ matrix.preset }}
      - name: D3D11 WARP correctness (software, not hardware certification)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "out/${{ matrix.preset }}/ParticleWorld.exe"
          & $executable --software-gpu --capabilities "out/warp-capabilities.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $executable --software-gpu --gpu-test 2>&1 | Tee-Object -FilePath "out/warp-gpu-test.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: D3D11 WARP granular stability fixtures
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "out/${{ matrix.preset }}/ParticleWorld.exe"
          & $executable --software-gpu --granular-check --report "out/granular-stability.json" 2>&1 | Tee-Object -FilePath "out/granular-stability.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: D3D11 WARP replay regression
        if: runner.os == 'Windows'
        timeout-minutes: 7
        run: python tests/replay_regression.py out/${{ matrix.preset }}/ParticleWorld.exe out/replay-regression --software-gpu
      - name: D3D11 WARP ten-minute granular soak
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "out/${{ matrix.preset }}/ParticleWorld.exe"
          & $executable --software-gpu --granular --capacity 129 --soak 600 --report "out/granular-soak.json" 2>&1 | Tee-Object -FilePath "out/granular-soak.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: WARP-validation-wg${{ matrix.workgroup }}
          path: |
            out/warp-capabilities.json
            out/warp-gpu-test.txt
            out/granular-stability.json
            out/granular-stability.txt
            out/granular-soak.json
            out/granular-soak.txt
            out/replay-regression/
      - uses: actions/upload-artifact@v4
        with:
          name: ParticleWorld-${{ matrix.preset }}-wg${{ matrix.workgroup }}
          path: out/${{ matrix.preset }}
# Hosted WARP execution is software correctness evidence, not hardware certification.
# Run native interaction/soak checks separately on Metal and D3D11 reference hardware.
